{# SPEC-017: partial template for the submission area, swapped in-place by HTMX #}
<div id="submission-area">
  {% if error %}
  <p class="field-error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/activities/{{ view.id }}/submit" hx-post="/activities/{{ view.id }}/submit" hx-target="#submission-area" hx-swap="innerHTML" hx-disabled-elt="find button">
    <label class="form-label" for="response">💭 What's your reading of it?</label>
    <textarea id="response" name="response" class="form-control" rows="8" required placeholder="There isn't a right answer. Tell us what you notice...">{{ submitted_response or "" }}</textarea>
    <p class="form-actions">
      <button type="submit" class="button">I'm ready <span aria-hidden="true">→</span></button>
      <span class="htmx-indicator loading-indicator" aria-live="polite">Evaluating your response…</span>
    </p>
  </form>
</div>
