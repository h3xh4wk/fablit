{% extends "base.html" %}
{% block title %}Reflection{% endblock %}
{% block content %}
<article class="reflection">
  <nav class="subnav" aria-label="Back to the activity list">
    <a href="/"><span aria-hidden="true">←</span> All activities</a>
  </nav>
  <h1 class="display">One last thing</h1>
  <p class="lede">You've had a chance to think about your feedback. One question to carry it forward.</p>
  <p class="reflection__prompt">{{ view.prompt }}</p>
  {% if error %}
  <p class="field-error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/reflect">
    <label class="form-label" for="content">Your reflection</label>
    <textarea id="content" name="content" class="form-control" rows="8" required>{{ submitted_content or "" }}</textarea>
    <p class="form-actions">
      <button type="submit" class="button">Save reflection</button>
    </p>
  </form>
</article>
{% endblock %}
