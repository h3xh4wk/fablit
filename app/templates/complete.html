{% extends "base.html" %}
{% block title %}Done{% endblock %}
{% block content %}
<article class="completion">
  <h1 class="display">✨ That's one done.</h1>
  <p class="completion__note">You noticed. You thought. You found something.</p>
  <p class="completion__detail">{{ view.message }}</p>
  <p class="form-actions">
    <a class="button" href="/history">See your practice history <span aria-hidden="true">→</span></a>
    <a class="button button--secondary" href="/">Back to explore <span aria-hidden="true">→</span></a>
  </p>
</article>
{% endblock %}
