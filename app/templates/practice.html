{% extends "base.html" %}
{% block title %}{{ view.title }}{% endblock %}
{% block content %}
<article class="practice">
  <nav class="subnav" aria-label="Back to the activity list">
    <a href="/"><span aria-hidden="true">←</span> All activities</a>
  </nav>
  <p class="practice__invitation" aria-hidden="true">👀 Look a little closer</p>
  <h1 class="practice__title">{{ view.title }}</h1>
  {% if view.stimulus %}
  <figure class="stimulus">
    <img class="stimulus__image" src="{{ view.stimulus.image_url }}" alt="{{ view.stimulus.alt_text }}">
    {% if view.stimulus.attribution %}
    <figcaption class="stimulus__attribution">
      {{ view.stimulus.attribution }}
      {% if view.stimulus.source_url %}<a class="stimulus__source" href="{{ view.stimulus.source_url }}">Source</a>{% endif %}
    </figcaption>
    {% endif %}
  </figure>
  {% endif %}
  <p class="practice__prompt">{{ view.prompt }}</p>
  <p class="practice__skill">{{ view.skills|join(", ") }}</p>
  {% if error %}
  <p class="field-error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/activities/{{ view.id }}/submit">
    <label class="form-label" for="response">💭 What's your reading of it?</label>
    <textarea id="response" name="response" class="form-control" rows="8" required placeholder="There isn't a right answer. Tell us what you notice...">{{ submitted_response or "" }}</textarea>
    <p class="form-actions">
      <button type="submit" class="button">I'm ready <span aria-hidden="true">→</span></button>
    </p>
  </form>
</article>
{% endblock %}
