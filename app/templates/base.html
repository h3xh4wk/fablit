<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fablit{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/fablit.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body hx-boost="true">
  <a class="skip-link" href="#main" hx-boost="false">Skip to content</a>
  <header class="site-header">
    <a class="site-header__brand" href="/">Fablit</a>
  </header>
  <main id="main" class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
