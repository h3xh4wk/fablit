<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fablit{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/fablit.css">
  <!-- Error pages carry the author-facing explanation; swap them in rather
       than leaving the page unchanged after a refused action. -->
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/js/export.js" defer></script>
  <script src="/static/js/session-recovery.js" defer></script>
  <script src="/static/js/authoring-scroll.js" defer></script>
</head>
<body hx-boost="true">
  <a class="skip-link" href="#main" hx-boost="false">Skip to content</a>
  <header class="site-header">
    <a class="site-header__brand" href="/">Fablit</a>
    <nav class="site-header__nav" aria-label="Primary">
      <a class="site-header__link" href="/pulse">Fashion &amp; Design Pulse</a>
      <a class="site-header__link" href="/history">Your practice</a>
    </nav>
  </header>
  <main id="main" class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
