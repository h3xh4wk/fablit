<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title">
  <title id="title">Fablit composition stimulus</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e2d8"/>
      <stop offset="0.7" stop-color="#b9a68e"/>
      <stop offset="1" stop-color="#3a3128"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- quiet, empty left side (negative space) -->
  <line x1="210" y1="0" x2="210" y2="600" stroke="#fffdf9" stroke-opacity="0.45" stroke-width="5"/>
  <circle cx="120" cy="90" r="26" fill="#fffdf9" fill-opacity="0.25"/>
  <!-- the subject: a standing figure set against the darker ground -->
  <path d="M540 600 C540 490 585 445 565 360 C552 300 478 300 465 360 C445 445 490 490 490 600 Z" fill="#2b2620"/>
  <circle cx="515" cy="282" r="46" fill="#2b2620"/>
  <!-- a soft highlight rim that separates the figure from the dark ground -->
  <path d="M565 360 C552 300 478 300 465 360" fill="none" stroke="#e8935a" stroke-opacity="0.55" stroke-width="3"/>
</svg>
