<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title">
  <title id="title">Fablit street scene stimulus</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcc6"/>
      <stop offset="1" stop-color="#d9c6a8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4927a"/>
      <stop offset="1" stop-color="#8a7660"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- a quiet street: shopfronts on one side, an open road, a few passers-by -->
  <!-- the shopfront row -->
  <g>
    <rect x="0" y="130" width="240" height="250" fill="#c4b096" stroke="#8a7460" stroke-width="4"/>
    <rect x="20" y="200" width="90" height="180" fill="#6f6152"/>
    <rect x="130" y="200" width="90" height="180" fill="#6f6152"/>
    <rect x="0" y="150" width="240" height="34" fill="#9c3f3f" fill-opacity="0.75"/>
    <rect x="260" y="100" width="250" height="280" fill="#cdbba0" stroke="#8a7460" stroke-width="4"/>
    <rect x="285" y="180" width="95" height="200" fill="#6f6152"/>
    <rect x="400" y="180" width="90" height="200" fill="#6f6152"/>
    <rect x="260" y="122" width="250" height="32" fill="#4a6152" fill-opacity="0.8"/>
    <!-- an awning casting a soft shadow -->
    <path d="M270 168 L 500 168 L 516 200 L 254 200 Z" fill="#b0563e" fill-opacity="0.85"/>
    <path d="M254 200 L 516 200 L 516 224 L 254 224 Z" fill="#8a7460" fill-opacity="0.35"/>
    <!-- small display details in the windows -->
    <rect x="305" y="330" width="55" height="34" fill="#e8dccb"/>
    <rect x="418" y="336" width="50" height="28" fill="#e8dccb"/>
    <rect x="35" y="332" width="60" height="30" fill="#e8dccb"/>
  </g>
  <!-- the road, narrowing toward a vanishing point -->
  <rect x="0" y="380" width="800" height="220" fill="url(#road)"/>
  <path d="M330 380 L 400 380 L 470 600 L 300 600 Z" fill="#d9c6a8" fill-opacity="0.35"/>
  <path d="M180 600 L 250 380" stroke="#efe4d4" stroke-width="5" stroke-dasharray="26 22" stroke-opacity="0.6"/>
  <!-- long shadows from the low sun -->
  <path d="M0 380 L 240 380 L 120 600 L 0 600 Z" fill="#5c4d3c" fill-opacity="0.28"/>
  <!-- three passers-by -->
  <g fill="#4f4437">
    <g transform="translate(560 330)">
      <circle cx="0" cy="0" r="17"/>
      <path d="M-14 18 Q 0 8 14 18 L 11 92 Q 0 98 -11 92 Z"/>
      <path d="M-10 90 L -14 150 L -4 150 L 2 96 L 8 150 L 18 150 L 12 88 Z"/>
    </g>
    <g transform="translate(648 356) scale(0.86)">
      <circle cx="0" cy="0" r="17"/>
      <path d="M-14 18 Q 0 8 14 18 L 11 92 Q 0 98 -11 92 Z"/>
      <path d="M-10 90 L -14 150 L -4 150 L 2 96 L 8 150 L 18 150 L 12 88 Z"/>
    </g>
    <g transform="translate(300 470) scale(0.6)">
      <circle cx="0" cy="0" r="17"/>
      <path d="M-14 18 Q 0 8 14 18 L 11 92 Q 0 98 -11 92 Z"/>
      <path d="M-10 90 L -14 150 L -4 150 L 2 96 L 8 150 L 18 150 L 12 88 Z"/>
    </g>
  </g>
  <!-- warm evening light across the whole scene -->
  <path d="M800 0 L 800 600 L 560 600 Z" fill="#fff3dd" fill-opacity="0.22"/>
</svg>
