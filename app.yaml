# Google App Engine deployment configuration for Fablit (SPEC-034).
# Target runtime: Python 3.12 (standard environment).
runtime: python312
instance_class: F1

entrypoint: uvicorn app.main:app --host 0.0.0.0 --port $PORT

handlers:
  - url: /static
    static_dir: app/static
    secure: always

  - url: /.*
    script: auto
    secure: always

env_variables:
  FABLIT_ENV: "production"
  FABLIT_DEBUG: "false"
  FABLIT_LOG_LEVEL: "INFO"
  FABLIT_LOG_FORMAT: "json"
  FABLIT_PRACTICE_HISTORY_REPOSITORY: "datastore"
  FABLIT_ARTIFACT_STORAGE_BACKEND: "gcs"
  # Target GCS bucket for private sketchbook artifacts (SPEC-034).
  # Required: AppConfig rejects the 'gcs' backend without a bucket name, so
  # startup fails fast when this is unset. "<project-id>.appspot.com" is the
  # default App Engine bucket and already exists in the project.
  # Override with: gcloud app deploy --set-env-vars FABLIT_ARTIFACT_STORAGE_BUCKET=<bucket-name>
  FABLIT_ARTIFACT_STORAGE_BUCKET: "fablit-app.appspot.com"
  # Shared secret for internal AI practice authoring access (SEC-001).
  # Unset or empty disables authoring routes by default.
  # FABLIT_AUTHORING_SECRET: "<your-authoring-secret>"
  # Optional API key for server-side AI practice authoring provider (SPEC-032 / SEC-001).
  # FABLIT_AI_PROVIDER_API_KEY: "<your-ai-provider-api-key>"
  # Optional Gemini model for the authoring provider adapter (ARCH-001).
  # Defaults to gemini-2.5-flash; only used when the API key above is set.
  # FABLIT_AI_PROVIDER_MODEL: "gemini-2.5-flash"
  # Shared candidate store for internal AI practice authoring (FIX-7 / SPEC-032).
  # Use datastore on App Engine so authoring candidate state is shared across instances.
  FABLIT_AUTHORING_CANDIDATE_STORE: "datastore"
  # Default retention window for unapproved candidates in days (FIX-7).
  FABLIT_AUTHORING_CANDIDATE_RETENTION_DAYS: "30"
  # Published practice store for the learner library (SPEC-035).
  # Use datastore on App Engine so published practices are shared across instances.
  FABLIT_PUBLISHED_PRACTICE_STORE: "datastore"
