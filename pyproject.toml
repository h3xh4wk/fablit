[project]
name = "fablit"
version = "0.1.0"
description = "Bootstrap platform for Fablit."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=0.13.0",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "build>=1.2.2.post1",
    "httpx2>=0.28.0",
    "mypy>=1.17.0",
    "playwright>=1.54.0",
    "pytest>=8.4.1",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.4.0",
    "twine>=4.0.2",
    "ruff>=0.12.5",
]

[project.urls]
Source = "https://github.com/h3xh4wk/fablit"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "fablit*"]
exclude = ["tests*", "docs*", "specifications*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "fablit", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]
